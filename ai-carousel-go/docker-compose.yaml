services:
  aicarousel:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-7123}:7123"
    volumes:
      - aicarousel-data:/app/data
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/aicarousel.db
    networks:
      - shared-net
    restart: unless-stopped

volumes:
  aicarousel-data:

# External network — create once with: docker network create shared-net
# Allows other containers on this host to reach the server at aicarousel:7123
# without going through the host network.
networks:
  shared-net:
    external: true
